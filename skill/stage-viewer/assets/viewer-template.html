<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三维查看</title>
<style>
  :root { --bg:#16181d; --panel:rgba(24,26,32,.88); --line:#2c303a; --text:#e6e8ee; --dim:#8b91a0; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  .bar { position:fixed; left:12px; right:12px; bottom:12px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; pointer-events:none; }
  .group { display:flex; gap:2px; padding:3px; background:var(--panel); border:1px solid var(--line); border-radius:8px; pointer-events:auto; backdrop-filter:blur(6px); }
  button { background:transparent; color:var(--text); border:0; border-radius:5px; padding:7px 10px; font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover { background:#2a2e38; }
  button.on { background:var(--accent); color:#fff; }
  #info { position:fixed; top:12px; left:12px; max-width:min(320px,calc(100% - 24px)); padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; display:none; }
  #info b { display:block; font-size:14px; margin-bottom:4px; }
  #info .k { color:var(--dim); }
  #title { position:fixed; top:12px; right:12px; padding:8px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--dim); }
  #name { cursor:pointer; color:var(--text); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:10; }
  .hint { color:var(--dim); font-size:12px; }
  #walkHint { position:fixed; top:12px; left:50%; transform:translateX(-50%); padding:6px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--dim); white-space:nowrap; display:none; }
  #joy { position:fixed; left:24px; bottom:110px; width:120px; height:120px; border-radius:50%; background:rgba(20,22,28,.45); border:2px solid rgba(255,255,255,.35); backdrop-filter:blur(4px); display:none; touch-action:none; }
  #joy div { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(76,141,255,.85); box-shadow:0 2px 8px rgba(0,0,0,.4); pointer-events:none; }
  body.walking #walkHint { display:block; }
  #flyHint { position:fixed; left:12px; bottom:64px; color:var(--dim); font-size:12px; }
  body.walking #flyHint { display:none; }
  @media (pointer:coarse) { #flyHint { display:none; } }
  #walkBtns { position:fixed; right:24px; bottom:110px; gap:10px; display:none; }
  body.walking #walkBtns { display:flex; }
  #walkBtns button { width:64px; height:64px; border-radius:50%; padding:0; background:rgba(20,22,28,.6); border:2px solid rgba(255,255,255,.35); backdrop-filter:blur(4px); font-size:15px; }
  #walkBtns button.on { background:var(--accent); }
  #side { position:fixed; top:56px; right:12px; width:250px; max-height:calc(100% - 140px); overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .panel { padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .sec-head { display:flex; justify-content:space-between; font-weight:600; cursor:pointer; user-select:none; }
  .sec-head::after { content:'▾'; color:var(--dim); }
  .closed .sec-head::after { content:'▸'; }
  .closed .sec-body { display:none; }
  .sec-body { margin-top:8px; }
  .lift + .lift { margin-top:10px; }
  .lg-row { display:flex; gap:4px; margin-top:4px; }
  .lg { display:flex; justify-content:space-between; flex:1; min-width:0; background:#2a2e38; text-align:left; }
  .lg-beam { padding:5px 8px; font-size:12px; background:#2a2e38; }
  .lg-beam.on, #stars.on { background:var(--accent); }
  .lg-all + .lg-all { margin-top:6px; }
  .lg.on { background:#33507f; }
  .lg .k { color:var(--dim); font-size:12px; }
  .lg-all { display:flex; gap:6px; align-items:center; }
  .lg-all button { background:#2a2e38; padding:5px 8px; }
  .lg-all .k { color:var(--dim); }
  .lg-all input { flex:1; min-width:0; accent-color:var(--accent); }
  .lift-head { display:flex; justify-content:space-between; margin-bottom:6px; }
  .lift-head .k { color:var(--dim); }
  .lift-head b { color:var(--text); font-weight:600; }
  .lift-ctl { display:flex; align-items:center; gap:6px; }
  .lift-ctl input { flex:1; min-width:0; accent-color:var(--accent); }
  .lift-ctl button { padding:5px 8px; background:#2a2e38; }
  .cam-row { display:flex; gap:6px; flex-wrap:wrap; }
  .cam-row button, .cam-types button { background:#2a2e38; padding:5px 8px; }
  .cam-types { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:6px; }
  .cam-types button { display:flex; flex-direction:column; align-items:flex-start; }
  .cam-types .k, .cam-item .k { color:var(--dim); font-size:12px; }
  .cam-item { display:flex; align-items:center; gap:6px; width:100%; margin-top:4px; background:#2a2e38; text-align:left; }
  .cam-item .k { margin-left:auto; }
  .cam-item.on { background:#33507f; }
  .cam-item i { width:10px; height:10px; border-radius:50%; flex:none; }
  .cam-edit { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .cam-edit label { display:flex; gap:6px; align-items:baseline; }
  .cam-edit label .k { color:var(--dim); }
  .cam-edit input { width:100%; accent-color:var(--accent); }
  .cam-edit select { width:100%; background:#2a2e38; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px; font:inherit; }
  .cam-heights { display:flex; flex-wrap:wrap; gap:4px; }
  .cam-heights button { background:#2a2e38; padding:4px 7px; font-size:12px; }
  .cam-heights button.on { background:var(--accent); }
  #camHint { position:fixed; top:56px; left:50%; transform:translateX(-50%); padding:8px 14px; background:var(--accent); color:#fff; border-radius:8px; z-index:5; max-width:calc(100% - 24px); }
  #pip { position:fixed; left:12px; bottom:84px; width:min(36vw, 480px); aspect-ratio:16/9; border:2px solid #fff; border-radius:4px; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.5); }
  #pip.big { width:min(70vw, 1100px); }
  #pip .safe { position:absolute; border:1px dashed rgba(255,255,255,.55); pointer-events:none; }
  #pip .act { inset:5%; }
  #pip .title { inset:10%; border-color:rgba(255,207,63,.7); }
  #pip .cross { position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; background:linear-gradient(#fff,#fff) center/100% 1px no-repeat, linear-gradient(#fff,#fff) center/1px 100% no-repeat; opacity:.7; pointer-events:none; }
  #pip .pip-label { position:absolute; left:0; top:0; padding:2px 8px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; border-bottom-right-radius:4px; pointer-events:none; }
  body.walking #pip { display:none; }
  @media (max-width:600px) { #pip { width:calc(100% - 24px); bottom:auto; top:110px; } #pip.big { width:calc(100% - 24px); } }
  #dpBar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px; padding:4px 8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; max-width:calc(100% - 24px); }
  #dpBar[hidden] { display:none; }
  /* 观众视角：顶部一条，提示 + 快捷座位。坐着时只能转头，走动的按钮、摇杆、提示都不显示 */
  #seatBar { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:6; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px 6px; padding:4px 8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; width:max-content; max-width:calc(100% - 24px); }
  #seatBar[hidden] { display:none; }
  #seatTip { padding:0 6px; color:var(--dim); white-space:nowrap; }
  #seatTip b { color:var(--text); margin-right:8px; }
  #seatBar button { background:#2a2e38; }
  body.seating #walkHint, body.seating #walkBtns, body.seating #joy { display:none !important; }
  @media (max-width:600px) { #seatBar { width:calc(100% - 24px); } #seatTip { flex-basis:100%; text-align:center; padding:2px 0; } body.seating #side { display:none; } }
  .icon { display:flex; align-items:center; padding:7px 9px; }
  /* 构件信息卡里的表面材质：材质一排、颜色一排 */
  #info .sf { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:6px; }
  #info .sf .k { width:100%; }
  #info .sf button { background:#2a2e38; padding:4px 8px; font-size:12px; }
  #info .sf button.on { background:var(--accent); }
  #info .sw { width:22px; height:22px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.18); box-sizing:border-box; }  /* 淡边：深色色块在面板上也看得见 */
  #info .sw.on { border-color:#fff; }
  #info .sw-pick { position:relative; overflow:hidden; cursor:pointer; background:conic-gradient(#e44, #ec4, #4c6, #4ae, #84e, #e44); }
  #info .sw-pick input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  #info .sf-n { margin-top:4px; font-size:12px; }
  #saveCopy { flex:none; background:var(--accent); color:#fff; }  /* 右侧面板列的最上面 */
  #saveCopy[hidden] { display:none; }
  /* 环绕视频：相机图标旁的小菜单，录制中顶部一条红点提示 */
  #capWrap { position:relative; }
  #vidMenu { position:absolute; bottom:calc(100% + 6px); right:0; display:flex; flex-direction:column; gap:6px; padding:10px; width:max-content; background:var(--panel); border:1px solid var(--line); border-radius:8px; backdrop-filter:blur(6px); }
  #vidMenu[hidden] { display:none; }
  #vidMenu .vm-t { font-weight:600; display:flex; flex-direction:column; gap:2px; }
  #vidMenu .vm-t .k { font-weight:400; font-size:12px; }
  #vidMenu .vm-row { display:flex; align-items:center; gap:4px; }
  #vidMenu .vm-row .k { width:36px; }
  #vidMenu .vm-row button { background:#2a2e38; padding:5px 9px; }
  #vidMenu .vm-row button.on { background:var(--accent); }
  #vidGo { background:var(--accent); margin-top:2px; }
  #recBar { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:7; display:flex; align-items:center; gap:8px; padding:4px 6px 4px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  #recBar[hidden] { display:none; }
  #recBar i { width:9px; height:9px; border-radius:50%; background:#ff4d4f; }
  #recBar button { background:#2a2e38; }
  body.recording .bar, body.recording #side, body.recording #info, body.recording #flyHint { display:none; }
  .icon svg { width:16px; height:16px; }
  #dpBar button { background:#2a2e38; }
  #dpBar button.on { background:var(--accent); }
  #dpBar input { width:90px; accent-color:var(--accent); }
  #dpBar label, #dpBar span { color:var(--dim); }
  .dp-title { color:var(--text) !important; font-weight:600; margin-right:4px; }
  #dpLabels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .dp-label { position:absolute; left:0; top:0; padding:2px 8px; background:rgba(0,0,0,.75); color:#ffd23f; border:1px solid #ffd23f; border-radius:4px; font-size:12px; white-space:nowrap; }
  .dp-label b { color:#fff; margin-right:4px; }
  body.dp .bar, body.dp #flyHint, body.dp #title { display:none; }
  body.dp #pip { width:min(34vw, 600px); top:12px; bottom:auto; }
  body.dp #pip.big { width:min(60vw, 1000px); }
  @media (max-width:700px) { body.dp #pip, body.dp #pip.big { width:calc(100% - 24px); } }
  .cam-row2 { display:grid; grid-template-columns:auto 1fr auto 1fr; gap:4px 6px; align-items:center; }
  .cam-row2 input, .cam-row2 select, .cam-pick input { width:100%; min-width:0; background:#2a2e38; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 6px; font:inherit; }
  .cam-track { display:flex; flex-direction:column; gap:4px; padding:8px; margin:4px 0; border:1px solid var(--line); border-radius:6px; }
  .cam-track .sec-sub { font-weight:600; }
  .cam-track .sec-sub .k { font-weight:400; color:var(--dim); font-size:12px; margin-left:4px; }
  .cam-track button.on { background:var(--accent); }
  .cam-track button.play { background:#2f7d4f; min-width:76px; }
  .cam-track select { width:auto; }
  #focusLabels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  body.walking #focusLabels { display:none; }
  .cam-row button.on { background:var(--accent); }
  .cam-focus { margin-top:6px; padding:8px; border:1px solid #ffd23f66; border-radius:6px; display:flex; flex-direction:column; gap:3px; }
  .cam-focus .sec-sub { display:flex; justify-content:space-between; align-items:center; font-weight:600; color:#ffd23f; }
  .cam-focus .sec-sub button { background:#2a2e38; padding:3px 8px; font-weight:400; }
  .cam-focus .fd { display:flex; gap:6px; align-items:baseline; font-size:12px; }
  .cam-focus .fd i { width:8px; height:8px; border-radius:50%; flex:none; align-self:center; }
  .cam-focus .fd b { white-space:nowrap; }
  .cam-focus .fd span { color:var(--dim); min-width:0; }
  .cam-pick { margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:6px; align-items:center; }
  .cam-pick .cam-types { grid-column:1 / -1; margin-top:0; }
  #showWrap { position:relative; }
  #showMenu { position:absolute; bottom:calc(100% + 6px); right:0; display:flex; flex-direction:column; gap:2px; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; backdrop-filter:blur(6px); }
  #showMenu[hidden] { display:none; }
  #showMenu button { text-align:left; }
  body:not(.dp) #cams, body:not(.dp) #pip, body:not(.dp) #camHint { display:none; }
  .cam-2 { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .cam-2 > div { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .cam-edit label select { width:auto; margin-left:auto; padding:2px 4px; font-size:12px; }
  .cam-edit label button { margin-left:auto; padding:1px 6px; font-size:12px; background:#2a2e38; }
  .cam-edit label button + button { margin-left:0; }
  #toast { position:fixed; top:40%; left:50%; transform:translateX(-50%); padding:8px 14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; display:none; }
  @media (pointer:coarse) { body.walking #joy { display:block; } body.walking #walkHint { display:none; } }
  @media (max-width:600px) { #joy, #walkBtns { bottom:180px; } #side { top:12px; width:auto; left:12px; max-height:45vh; } #info { top:auto; bottom:190px; } body.walking #side { display:none; } #title { display:none; } button { padding:7px 8px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><div>加载模型…</div></div>

<div id="flyHint">WASD 飞行 · E/Q 升降 · Shift 加速</div>
<div id="title"><span id="name" translate="no"></span> · <span id="dims">–</span></div>
<div id="info"></div>
<div id="walkHint">WASD 移动 · 拖动转向 · Shift 加速 · 空格 跳 · C 坐下/站起 · Esc 退出</div>
<div id="joy"><div></div></div>
<div id="walkBtns"><button id="jump">跳</button><button id="sit">坐下</button></div>
<div id="side">
  <button id="saveCopy" hidden title="把改过的表面材质存进一个新的 html，发给别人打开也是这个样子">保存为新文件</button>
  <section id="cams" class="panel"><div class="sec-head">机位</div><div class="sec-body"></div></section>
  <section id="lifts" class="panel" hidden><div class="sec-head">升降屏</div><div class="sec-body"></div></section>
  <section id="machines" class="panel" hidden><div class="sec-head">机械</div><div class="sec-body"></div></section>
  <section id="lights" class="panel" hidden><div class="sec-head">灯光</div><div class="sec-body">
    <div class="lg-all"><button data-all="1">全开</button><button data-all="0">全关</button></div>
    <div class="lg-all"><label class="k" for="level">亮度</label><input id="level" type="range" min="0" max="2" step="0.05" value="1"><button id="stars" class="on">星光</button></div>
  </div></section>
  <section id="speakers" class="panel" hidden><div class="sec-head">音响</div><div class="sec-body">
    <div class="lg-all"><button data-all="1">全部显示</button><button data-all="0">全部隐藏</button></div>
  </div></section>
</div>
<div id="toast"></div>
<div id="recBar" hidden><i></i>录制中 <b id="recT">0</b> / <span id="recLen">10</span> 秒<button id="recStop">停止</button></div>
<div id="seatBar" hidden><span id="seatTip"></span><span id="seatQuick"><button data-seat="left">最左</button><button data-seat="right">最右</button><button data-seat="back">最后一排</button></span><button data-seat="pick">换座位</button><button data-seat="exit">退出</button></div>
<div id="camHint" hidden></div>
<div id="dpLabels" hidden></div>
<div id="dpBar" hidden>
  <span class="dp-title">导摄模式</span>
  <button data-dp="measure">测距</button><button data-dp="clear">清除测距</button><button data-dp="fit">全图</button>
  <label for="dpCut">剖切</label><input id="dpCut" type="range" min="2" max="16" step="0.5" value="6"><span id="dpCutV">6m</span>
  <button data-dp="exit">退出导摄</button>
</div>
<div id="pip" hidden><div class="safe act"></div><div class="safe title"></div><div class="cross"></div><div class="pip-label"></div></div>

<div class="bar">
  <div class="group" id="views">
    <button data-view="front">正立面</button>
    <button data-view="left">左侧 45°</button>
    <button data-view="right">右侧 45°</button>
    <button data-view="top">平面</button>
  </div>
  <div class="group">
    <button id="walk">人物走动</button>
    <button id="seatBtn" title="坐到观众席任一座位，看那里的画面">观众视角</button>
    <button id="dpEnter">导摄模式</button>
  </div>
  <div class="group" id="showWrap">
    <button id="showBtn">显示 ▴</button>
    <div id="showMenu" hidden>
      <button id="edges">白模+线</button>
      <button id="screens" class="on" hidden>屏幕内容</button>
      <button id="person" class="on">人物比例</button>
      <button id="grid" class="on">网格</button>
    </div>
  </div>
  <div class="group" id="capWrap"><button id="shot" class="icon" title="截图：把当前画面存成图片" aria-label="截图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5l2-3h5l2 3H20v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button id="vidBtn" class="icon" title="环绕视频：从当前视角绕一圈录成视频" aria-label="环绕视频"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg></button>
    <div id="vidMenu" hidden>
      <div class="vm-t">环绕视频<span class="k">从当前视角开始，不带界面</span></div>
      <div class="vm-row"><span class="k">角度</span><button data-arc="90">90°</button><button data-arc="180" class="on">180°</button><button data-arc="360">360°</button></div>
      <div class="vm-row"><span class="k">时长</span><button data-secs="10" class="on">10 秒</button><button data-secs="20">20 秒</button><button data-secs="30">30 秒</button></div>
      <div class="vm-row"><span class="k">方向</span><button data-dir="1" class="on">向左转</button><button data-dir="-1">向右转</button></div>
      <button id="vidGo">开始录制</button>
    </div>
  </div>
